name: feed

on:
  schedule:
    - cron: "17 06 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Final UTC date (YYYY-MM-DD); blank uses yesterday"
        required: false
        type: string

concurrency:
  group: daily-arxiv-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.ATLAS_FEED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install checks
        run: python -m pip install -r dev.txt
      - name: Fetch complete daily intake
        env:
          FEED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$FEED_DATE" ]; then
            python pipeline/feed.py --date "$FEED_DATE"
          else
            python pipeline/feed.py --days 4
          fi
      - name: Verify feed contracts
        run: |
          python -m unittest tests.test_feed tests.test_rank tests.test_feedcheck tests.test_db -v
          python pipeline/validate.py --skip-dist
      - name: Sync hosted search
        env:
          ATLAS_DATABASE_URL: ${{ secrets.ATLAS_DATABASE_URL }}
        run: |
          if [ -n "$ATLAS_DATABASE_URL" ]; then
            python pipeline/sync.py --feed-only
          else
            python pipeline/sync.py --feed-only --dry-run
          fi
      - name: Publish changed days
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/feed web/public/data/feed
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update daily arXiv feed"
          git push
