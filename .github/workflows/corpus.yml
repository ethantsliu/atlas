name: corpus

on:
  schedule:
    - cron: "17 04,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Maximum OAI pages this run"
        required: false
        default: "5000"
        type: string
      minutes:
        description: "Maximum harvest minutes"
        required: false
        default: "300"
        type: string

concurrency:
  group: arxiv-oai-corpus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_ROOT: data/cache/corpus
      CORPUS_ARCHIVE: data/cache/corpus/archive
      CHECKPOINT_TAG: oai-corpus-v1
      PROMOTED_TAG: corpus-v2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Initialize paths
        run: |
          echo "CORPUS_FILE=$RUNNER_TEMP/corpus.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ROOT=$RUNNER_TEMP/corpus-checkpoint" >> "$GITHUB_ENV"
          echo "CHECKPOINT_POINTER=$RUNNER_TEMP/corpus-checkpoint/checkpoint.json" >> "$GITHUB_ENV"
          echo "PRIOR_POINTER=$RUNNER_TEMP/corpus-checkpoint/prior.json" >> "$GITHUB_ENV"
          echo "PROMO_ROOT=$RUNNER_TEMP/corpus-promo" >> "$GITHUB_ENV"
          echo "PRIOR_ROOT=$RUNNER_TEMP/corpus-prior" >> "$GITHUB_ENV"

      - name: Restore release checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-parts" "$CHECKPOINT_ROOT"
          probe="$RUNNER_TEMP/checkpoint-release.txt"
          if ! gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" \
            > "$probe" 2>&1; then
            status=$(awk '/^HTTP/{code=$2} END{print code}' "$probe")
            if [ "$status" = "404" ]; then
              echo "No corpus checkpoint release exists yet."
              exit 0
            fi
            echo "Could not inspect corpus checkpoint release" >&2
            exit 1
          fi
          gh release download "$CHECKPOINT_TAG" \
            --pattern checkpoint.json \
            --dir "$RUNNER_TEMP/corpus-parts"
          cp "$RUNNER_TEMP/corpus-parts/checkpoint.json" "$PRIOR_POINTER"
          jq -e '
            .schema_version == 1 and
            (.archive_sha256 | test("^[0-9a-f]{64}$")) and
            (.archive_bytes | type == "number" and . >= 0) and
            (.parts | type == "array" and length > 0) and
            all(.parts[];
              (.name | test("^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\\.part$")) and
              (.sha256 | test("^[0-9a-f]{64}$")) and
              (.bytes | type == "number" and . > 0))
          ' "$PRIOR_POINTER" >/dev/null
          jq -c '.parts[]' "$PRIOR_POINTER" | while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            digest=$(jq -r '.sha256' <<<"$row")
            gh release download "$CHECKPOINT_TAG" \
              --pattern "$name" \
              --dir "$RUNNER_TEMP/corpus-parts"
            test "$(sha256sum "$RUNNER_TEMP/corpus-parts/$name" | awk '{print $1}')" = "$digest"
          done
          jq -r '.parts[].name' "$PRIOR_POINTER" | while read -r name; do
            cat "$RUNNER_TEMP/corpus-parts/$name"
          done > "$CORPUS_FILE"
          test "$(sha256sum "$CORPUS_FILE" | awk '{print $1}')" = \
            "$(jq -r '.archive_sha256' "$PRIOR_POINTER")"
          test "$(stat -c %s "$CORPUS_FILE")" = \
            "$(jq -r '.archive_bytes' "$PRIOR_POINTER")"
          python pipeline/corpus.py unpack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"

      - name: Verify harvester
        run: |
          python -m pip install -r dev.txt
          python -m unittest tests.test_oai tests.test_harvest tests.test_corpus -v
          ruff check pipeline/oai.py pipeline/harvest.py pipeline/corpus.py \
            tests/test_oai.py tests/test_harvest.py tests/test_corpus.py
          ruff format --check pipeline/oai.py pipeline/harvest.py pipeline/corpus.py \
            tests/test_oai.py tests/test_harvest.py tests/test_corpus.py

      - name: Harvest official metadata
        id: harvest
        continue-on-error: true
        env:
          MAX_PAGES: ${{ inputs.pages || '5000' }}
          MAX_MINUTES: ${{ inputs.minutes || '300' }}
        run: |
          python pipeline/corpus.py run \
            --root "$CORPUS_ROOT" \
            --max-pages "$MAX_PAGES" \
            --max-minutes "$MAX_MINUTES" | tee "$RUNNER_TEMP/corpus-result.json"

      - name: Validate checkpoint
        id: checkpoint
        continue-on-error: true
        if: always() && steps.harvest.outcome != 'skipped'
        run: python pipeline/corpus.py check --root "$CORPUS_ROOT"

      - name: Read prior promoted index
        if: steps.checkpoint.outcome == 'success'
        run: |
          mkdir -p "$PRIOR_ROOT"
          probe="$RUNNER_TEMP/promoted-release.txt"
          if ! gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" \
            > "$probe" 2>&1; then
            status=$(awk '/^HTTP/{code=$2} END{print code}' "$probe")
            if [ "$status" = "404" ]; then
              echo "No prior promoted corpus release exists yet."
              exit 0
            fi
            echo "Could not inspect promoted corpus release" >&2
            exit 1
          fi
          gh release download "$PROMOTED_TAG" \
            --pattern index.json \
            --dir "$PRIOR_ROOT" \
            --clobber

      - name: Merge sealed generations
        id: merge
        if: steps.checkpoint.outcome == 'success'
        run: |
          python pipeline/corpus.py merge \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_ARCHIVE" \
            --rules data/source/feed.json | tee "$RUNNER_TEMP/corpus-merge.json"
          if [ "$(jq '.pending | length' "$RUNNER_TEMP/corpus-merge.json")" -gt 0 ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare atomic promotion
        id: prep
        if: steps.merge.outputs.promote == 'true'
        run: |
          args=(
            --archive "$CORPUS_ARCHIVE"
            --output "$PROMO_ROOT"
          )
          if [ -f "$PRIOR_ROOT/index.json" ]; then
            args+=(--prior "$PRIOR_ROOT/index.json")
          fi
          python pipeline/corpus.py prep "${args[@]}" \
            | tee "$RUNNER_TEMP/corpus-promo.json"
          if [ "$(jq '.months | length' "$PROMO_ROOT/plan.json")" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(jq -r '.history.complete' "$CORPUS_ROOT/cursor.json")" = "true" ]; then
            index_sha=$(sha256sum "$PROMO_ROOT/index.json" | awk '{print $1}')
            paper_count=$(jq -r '.counts.all' "$PROMO_ROOT/index.json")
            jq -n \
              --arg index_sha256 "$index_sha" \
              --argjson paper_count "$paper_count" \
              '{schema_version:1,history_complete:true,index_sha256:$index_sha256,paper_count:$paper_count}' \
              > "$PROMO_ROOT/cloud-ready.json"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate promoted corpus
        if: steps.merge.outputs.promote == 'true'
        run: |
          python -m unittest tests.test_merge tests.test_corpus -v
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["PROMO_ROOT"])
          index = json.loads((root / "index.json").read_text())
          plan = json.loads((root / "plan.json").read_text())
          assert index["schema_version"] == 1
          assert sorted(plan["assets"]) == sorted(path.name for path in root.glob("*.json.gz"))
          assert set(plan["months"]) == {name[:7] for name in plan["assets"]}
          PY

      - name: Publish promoted shards
        if: steps.merge.outputs.promote == 'true'
        run: |
          gh release view "$PROMOTED_TAG" >/dev/null 2>&1 || \
            gh release create "$PROMOTED_TAG" \
              --title "Atlas corpus v2" \
              --notes "Official arXiv OAI metadata shards used by Atlas."
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' > "$RUNNER_TEMP/promo-assets.tsv"
          mkdir -p "$RUNNER_TEMP/promo-existing"
          jq -r '.assets[]' "$PROMO_ROOT/plan.json" | while read -r asset; do
            digest=$(jq -r --arg path "$asset" \
              '.shards[] | select(.path == $path) | .sha256' "$PROMO_ROOT/index.json")
            api_digest=$(awk -F '\t' -v name="$asset" '$1 == name {print $2; exit}' \
              "$RUNNER_TEMP/promo-assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            if grep -q "^$asset"$'\t' "$RUNNER_TEMP/promo-assets.tsv"; then
              gh release download "$PROMOTED_TAG" \
                --pattern "$asset" \
                --dir "$RUNNER_TEMP/promo-existing" \
                --clobber
              if [ "$(sha256sum "$RUNNER_TEMP/promo-existing/$asset" | awk '{print $1}')" = "$digest" ]; then
                continue
              fi
              echo "Promoted asset name collides with different content: $asset" >&2
              exit 1
            fi
            gh release upload "$PROMOTED_TAG" "$PROMO_ROOT/$asset"
          done
          gh release upload "$PROMOTED_TAG" "$PROMO_ROOT/index.json" --clobber
          if [ "${{ steps.prep.outputs.ready }}" = "true" ]; then
            gh release upload "$PROMOTED_TAG" "$PROMO_ROOT/cloud-ready.json" --clobber
          fi

      - name: Verify promoted release
        if: steps.merge.outputs.promote == 'true'
        run: |
          verify="$RUNNER_TEMP/corpus-verify"
          mkdir -p "$verify"
          gh release download "$PROMOTED_TAG" \
            --pattern index.json \
            --dir "$verify" \
            --clobber
          test "$(sha256sum "$verify/index.json" | awk '{print $1}')" = \
            "$(jq -r '.index_sha256' "$PROMO_ROOT/plan.json")"
          if [ "${{ steps.prep.outputs.ready }}" = "true" ]; then
            gh release download "$PROMOTED_TAG" \
              --pattern cloud-ready.json \
              --dir "$verify" \
              --clobber
            cmp "$PROMO_ROOT/cloud-ready.json" "$verify/cloud-ready.json"
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' > "$verify/assets.tsv"
          cut -f1 "$verify/assets.tsv" | sort -u > "$verify/assets.txt"
          jq -r '.shards[].path' "$verify/index.json" | sort -u > "$verify/required.txt"
          if comm -23 "$verify/required.txt" "$verify/assets.txt" | grep -q .; then
            echo "Promoted index references missing assets" >&2
            exit 1
          fi
          jq -r '.shards[] | [.path, .sha256] | @tsv' "$verify/index.json" | \
            while IFS=$'\t' read -r asset digest; do
            api_digest=$(awk -F '\t' -v name="$asset" '$1 == name {print $2; exit}' \
              "$verify/assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            gh release download "$PROMOTED_TAG" \
              --pattern "$asset" \
              --dir "$verify" \
              --clobber
            test "$(sha256sum "$verify/$asset" | awk '{print $1}')" = "$digest"
          done

      - name: Dispatch validated promotion
        if: steps.merge.outputs.promote == 'true' && steps.prep.outputs.ready == 'true'
        run: |
          jq -n \
            --arg tag "$PROMOTED_TAG" \
            --slurpfile plan "$PROMO_ROOT/plan.json" \
            '{event_type:"corpus-promoted",client_payload:{tag:$tag,months:$plan[0].months}}' \
            > "$RUNNER_TEMP/corpus-dispatch.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/corpus-dispatch.json"

      - name: Acknowledge promotion
        id: acknowledge
        if: steps.merge.outputs.promote == 'true'
        run: |
          args=()
          while read -r generation; do
            args+=(--generation "$generation")
          done < <(jq -r '.pending[]' "$RUNNER_TEMP/corpus-merge.json")
          python pipeline/corpus.py ack --root "$CORPUS_ROOT" "${args[@]}"

      - name: Package checkpoint
        id: package
        if: always() && steps.checkpoint.outcome == 'success'
        run: |
          python pipeline/corpus.py pack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"
          mkdir -p "$CHECKPOINT_ROOT/raw"
          split -b 1800m -d -a 4 "$CORPUS_FILE" "$CHECKPOINT_ROOT/raw/part-"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def file_hash(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path(os.environ["CHECKPOINT_ROOT"])
          archive = Path(os.environ["CORPUS_FILE"])
          archive_hash = file_hash(archive)
          parts = []
          for index, path in enumerate(sorted((root / "raw").glob("part-*"))):
              digest = file_hash(path)
              name = f"checkpoint-{archive_hash[:16]}-{index:04d}-{digest[:16]}.part"
              target = root / name
              path.replace(target)
              parts.append({
                  "name": name,
                  "sha256": digest,
                  "bytes": target.stat().st_size,
              })
          prior_path = Path(os.environ["PRIOR_POINTER"])
          prior = json.loads(prior_path.read_text()) if prior_path.is_file() else {}
          keep = sorted({row["name"] for row in parts} | {
              row["name"] for row in prior.get("parts", [])
          })
          pointer = {
              "schema_version": 1,
              "archive_sha256": archive_hash,
              "archive_bytes": archive.stat().st_size,
              "parts": parts,
              "keep": keep,
          }
          Path(os.environ["CHECKPOINT_POINTER"]).write_text(
              json.dumps(pointer, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload run checkpoint
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-checkpoint-${{ github.run_id }}
          path: |
            ${{ env.CHECKPOINT_POINTER }}
            ${{ env.CHECKPOINT_ROOT }}/checkpoint-*.part
            ${{ runner.temp }}/corpus-result.json
            ${{ runner.temp }}/corpus-merge.json
            ${{ runner.temp }}/corpus-promo.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish release checkpoint
        id: checkpoint_release
        if: always() && steps.package.outcome == 'success'
        run: |
          gh release view "$CHECKPOINT_TAG" >/dev/null 2>&1 || \
            gh release create "$CHECKPOINT_TAG" \
              --title "Atlas OAI corpus" \
              --notes "Restartable official arXiv metadata checkpoint."
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' > "$RUNNER_TEMP/checkpoint-assets.tsv"
          mkdir -p "$RUNNER_TEMP/checkpoint-existing"
          jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER" | \
            while IFS=$'\t' read -r name digest; do
            api_digest=$(awk -F '\t' -v asset="$name" '$1 == asset {print $2; exit}' \
              "$RUNNER_TEMP/checkpoint-assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            if grep -q "^$name"$'\t' "$RUNNER_TEMP/checkpoint-assets.tsv"; then
              gh release download "$CHECKPOINT_TAG" \
                --pattern "$name" \
                --dir "$RUNNER_TEMP/checkpoint-existing" \
                --clobber
              if [ "$(sha256sum "$RUNNER_TEMP/checkpoint-existing/$name" | awk '{print $1}')" = "$digest" ]; then
                continue
              fi
              echo "Checkpoint asset name collides with different content: $name" >&2
              exit 1
            fi
            gh release upload "$CHECKPOINT_TAG" "$CHECKPOINT_ROOT/$name"
          done
          gh release upload "$CHECKPOINT_TAG" "$CHECKPOINT_POINTER" --clobber
          verify="$RUNNER_TEMP/checkpoint-verify"
          mkdir -p "$verify"
          gh release download "$CHECKPOINT_TAG" \
            --pattern checkpoint.json \
            --dir "$verify" \
            --clobber
          cmp "$CHECKPOINT_POINTER" "$verify/checkpoint.json"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, (.digest // "")] | @tsv' > "$verify/assets.tsv"
          jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER" | \
            while IFS=$'\t' read -r name digest; do
            api_digest=$(awk -F '\t' -v asset="$name" '$2 == asset {print $3; exit}' \
              "$verify/assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            gh release download "$CHECKPOINT_TAG" \
              --pattern "$name" \
              --dir "$verify" \
              --clobber
            test "$(sha256sum "$verify/$name" | awk '{print $1}')" = "$digest"
          done
          while IFS=$'\t' read -r id name _digest; do
            if [[ ! "$name" =~ ^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\.part$ ]]; then
              continue
            fi
            if ! jq -e --arg name "$name" '.keep | index($name)' \
              "$CHECKPOINT_POINTER" >/dev/null; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done < "$verify/assets.tsv"

      - name: Retire stale shard assets
        if: >-
          always() &&
          steps.prep.outputs.changed == 'true' &&
          steps.acknowledge.outcome == 'success' &&
          steps.checkpoint_release.outcome == 'success'
        run: |
          jq -r '.keep[]' "$PROMO_ROOT/plan.json" | sort -u > "$RUNNER_TEMP/corpus-keep.txt"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r id name; do
            if [[ ! "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9a-f]{16}\.json\.gz$ ]]; then
              continue
            fi
            if ! grep -Fxq "$name" "$RUNNER_TEMP/corpus-keep.txt"; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done

      - name: Enforce harvest result
        if: steps.harvest.outcome == 'failure' || steps.checkpoint.outcome == 'failure'
        run: exit 1
