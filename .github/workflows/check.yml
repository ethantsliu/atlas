name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r dev.txt
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium firefox webkit
      - name: Verify committed artifacts and test
        run: make check PYTHON=python NPM=npm
