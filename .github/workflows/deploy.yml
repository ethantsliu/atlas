name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact release commit requested by a publisher"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ATLAS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Bind requested release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          checked_sha=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ] && [ "$checked_sha" != "$EXPECTED_SHA" ]; then
            echo "Requested release $EXPECTED_SHA, but checkout resolved $checked_sha" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - id: pages
        uses: actions/configure-pages@v5
      - name: Select base path
        env:
          CUSTOM_BASE: ${{ vars.ATLAS_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "ATLAS_BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
          else
            echo "ATLAS_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Install release checks
        run: |
          python -m pip install -r dev.txt
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium firefox webkit
      - name: Verify exact release commit
        run: |
          python pipeline/cloudpub.py
          make check PYTHON=python NPM=npm
        env:
          VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
          VITE_ATLAS_KEY: ${{ vars.ATLAS_KEY }}
      - name: Sync hosted corpus
        env:
          ATLAS_DATABASE_URL: ${{ secrets.ATLAS_DATABASE_URL }}
        run: |
          if [ -n "$ATLAS_DATABASE_URL" ]; then
            python pipeline/sync.py --corpus-only
          else
            python pipeline/sync.py --corpus-only --dry-run
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  publish:
    if: github.event_name == 'workflow_dispatch' || vars.ATLAS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Deploy public atlas
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe anonymous release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_url="${PAGE_URL/#http:/https:}"
          python3 pipeline/probe.py --base-url "$site_url" --attempts 5 --delay 5
