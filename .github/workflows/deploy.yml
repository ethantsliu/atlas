name: deploy

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.ATLAS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      certified_sha: ${{ steps.bind.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - id: bind
        name: Bind successful check and reject stale main
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          checked_sha=$(git rev-parse HEAD)
          remote=$(git ls-remote --exit-code origin refs/heads/main)
          current_sha=$(printf '%s\n' "$remote" | awk '$2 == "refs/heads/main" { print $1 }')
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$checked_sha" = "$CERTIFIED_SHA"
          test "$current_sha" = "$CERTIFIED_SHA"
          echo "sha=$CERTIFIED_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Select base path
        env:
          CUSTOM_BASE: ${{ vars.ATLAS_BASE_PATH }}
        run: |
          if [ -n "$CUSTOM_BASE" ]; then
            echo "ATLAS_BASE_PATH=$CUSTOM_BASE" >> "$GITHUB_ENV"
          else
            echo "ATLAS_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Install release build dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix web
      - name: Build certified release
        env:
          CERTIFIED_SHA: ${{ steps.bind.outputs.sha }}
          VITE_ATLAS_API_URL: ${{ vars.ATLAS_API_URL }}
          VITE_ATLAS_KEY: ${{ vars.ATLAS_KEY }}
        run: |
          python pipeline/cloudpub.py
          npm --prefix web run build
          printf '{"schema_version":1,"sha":"%s"}\n' "$CERTIFIED_SHA" > web/dist/release.json
      - name: Stage verified same-origin method assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="methods-v1"
          release="$RUNNER_TEMP/atlas-methods-release"
          restored="$RUNNER_TEMP/atlas-methods-public"
          mkdir -p "$release"
          status=$(curl --silent --show-error --location \
            --output "$release/release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          if [ "$status" = 200 ]; then
            test "$(jq -r '[.assets[] | select(.name == "browser.json")] | length' \
              "$release/release.json")" = 1
            test "$(jq -r '.assets[] | select(.name == "browser.json") | .state' \
              "$release/release.json")" = uploaded
            pointer_size=$(jq -er \
              '.assets[] | select(.name == "browser.json") | .size' \
              "$release/release.json")
            test "$pointer_size" -le 65536
            gh release download "$tag" --pattern browser.json --dir "$release"
            pointer_sha=$(sha256sum "$release/browser.json" | cut -d ' ' -f1)
            test "$(jq -r '.assets[] | select(.name == "browser.json") | .digest' \
              "$release/release.json")" = "sha256:$pointer_sha"
            archive=$(jq -er '.browser.path' "$release/browser.json")
            [[ "$archive" =~ ^browser-[0-9a-f]{64}\.tar\.gz$ ]]
            archive_size=$(jq -er '.browser.bytes' "$release/browser.json")
            archive_sha=$(jq -er '.browser.sha256' "$release/browser.json")
            test "$archive_size" -le 104857600
            test "$(jq -r --arg name "$archive" \
              '[.assets[] | select(.name == $name)] | length' \
              "$release/release.json")" = 1
            test "$(jq -r --arg name "$archive" \
              '.assets[] | select(.name == $name) | .state' \
              "$release/release.json")" = uploaded
            test "$(jq -r --arg name "$archive" \
              '.assets[] | select(.name == $name) | .size' \
              "$release/release.json")" = "$archive_size"
            test "$(jq -r --arg name "$archive" \
              '.assets[] | select(.name == $name) | .digest' \
              "$release/release.json")" = "sha256:$archive_sha"
            gh release download "$tag" --pattern "$archive" --dir "$release"
            python pipeline/methodbundle.py \
              --receipt "$release/browser.json" \
              --archive "$release/$archive" \
              --output "$restored" \
              --unpack
            candidate=$(jq -er '.candidates.path' "$release/browser.json")
            expected_size=$(jq -er '.candidates.bytes' "$release/browser.json")
            candidate_sha=$(jq -er '.candidates.sha256' "$release/browser.json")
            [[ "$candidate" = "candidates-$candidate_sha.jsonl.gz" ]]
            expected_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$candidate"
            test "$(jq -er '.assets.download.url' "$restored/index.json")" = "$expected_url"
            test "$(jq -r --arg name "$candidate" \
              '[.assets[] | select(.name == $name)] | length' \
              "$release/release.json")" = 1
            test "$(jq -r --arg name "$candidate" \
              '.assets[] | select(.name == $name) | .state' \
              "$release/release.json")" = uploaded
            test "$(jq -r --arg name "$candidate" \
              '.assets[] | select(.name == $name) | .digest' \
              "$release/release.json")" = "sha256:$candidate_sha"
            actual_size=$(jq -er --arg name "$candidate" \
              '.assets[] | select(.name == $name) | .size' "$release/release.json")
            test "$actual_size" = "$expected_size"
            mkdir "$release/fresh"
            gh release download "$tag" --pattern browser.json --dir "$release/fresh"
            cmp "$release/browser.json" "$release/fresh/browser.json"
            test ! -e web/dist/data/methods
            mkdir -p web/dist/data
            mv "$restored" web/dist/data/methods
          elif [ "$status" = 404 ]; then
            echo "No validated methods-v1 release exists; leaving methods unavailable."
          else
            echo "Method release lookup failed with HTTP $status" >&2
            exit 1
          fi
          test "$(du -sb web/dist | cut -f1)" -le 996147200
      - name: Reject stale corpus sync
        env:
          CERTIFIED_SHA: ${{ steps.bind.outputs.sha }}
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')
          test "$current_sha" = "$CERTIFIED_SHA"
      - name: Sync hosted corpus
        env:
          ATLAS_DATABASE_URL: ${{ secrets.ATLAS_DATABASE_URL }}
        run: |
          if [ -n "$ATLAS_DATABASE_URL" ]; then
            python pipeline/sync.py --corpus-only
          else
            python pipeline/sync.py --corpus-only --dry-run
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  publish:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.certified_sha }}
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - name: Reject a release made stale during build
        env:
          CERTIFIED_SHA: ${{ needs.build.outputs.certified_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')
          test "$current_sha" = "$CERTIFIED_SHA"
      - name: Deploy public atlas
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Probe anonymous release
        env:
          CERTIFIED_SHA: ${{ needs.build.outputs.certified_sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_url="${PAGE_URL/#http:/https:}"
          expected_cloud_source=$(python3 -c \
            'import json; print(json.load(open("web/public/data/cloud/index.json"))["source_count"])')
          python3 pipeline/probe.py \
            --base-url "$site_url" \
            --attempts 5 \
            --delay 5 \
            --expected-sha "$CERTIFIED_SHA" \
            --expected-cloud-source "$expected_cloud_source"
