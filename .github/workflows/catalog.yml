name: catalog

on:
  repository_dispatch:
    types: [corpus-promoted]
  schedule:
    - cron: "52 10 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Promoted corpus release tag"
        required: false
        default: "corpus-v2"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: atlas-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_TAG: ${{ github.event.client_payload.tag }}
      INPUT_TAG: ${{ inputs.tag }}
      CATALOG_OUTPUT: web/public/data/catalog.json
      QUESTIONS_OUTPUT: ${{ runner.temp }}/atlas-questions/questions.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read promoted corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-${ATLAS_CORPUS_TAG:-corpus-v2}}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid promoted corpus tag" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/atlas-catalog-archive"
          mkdir -p "$archive"
          gh release download "$tag" \
            --pattern index.json \
            --dir "$archive" \
            --clobber
          echo "ARCHIVE_ROOT=$archive" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download complete corpus
        shell: bash
        run: |
          set -euo pipefail
          manifest="$ARCHIVE_ROOT/index.json"
          jq -e '.schema_version == 1 and (.shards | type == "array")' "$manifest" >/dev/null
          jq -r '.shards[].path' "$manifest" > "$RUNNER_TEMP/atlas-catalog-assets.txt"
          while IFS= read -r path; do
            if [[ ! "$path" =~ ^[0-9]{4}-[0-9]{2}(-[0-9a-f]{16})?\.json\.gz$ ]]; then
              echo "Invalid promoted shard path: $path" >&2
              exit 1
            fi
            gh release download "${{ steps.corpus.outputs.tag }}" \
              --pattern "$path" \
              --dir "$ARCHIVE_ROOT" \
              --clobber
          done < "$RUNNER_TEMP/atlas-catalog-assets.txt"
          df -h "$RUNNER_TEMP"

      - name: Build complete archive catalog
        run: |
          python pipeline/catalog.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$CATALOG_OUTPUT"
          python pipeline/catalog.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$CATALOG_OUTPUT" \
            --check
          python -m unittest tests.test_catalog -v

      - name: Build unreviewed question candidates
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/questions.py \
            --catalog "$CATALOG_OUTPUT" \
            --output "$QUESTIONS_OUTPUT"
          python pipeline/questions.py \
            --catalog "$CATALOG_OUTPUT" \
            --output "$QUESTIONS_OUTPUT" \
            --check
          python -m unittest tests.test_questions -v

          directions=$(jq -r '.directions | length' "$CATALOG_OUTPUT")
          questions=$(jq -r '.candidates | length' "$QUESTIONS_OUTPUT")
          declared=$(jq -r '.counts.unreviewed_candidate_questions' "$QUESTIONS_OUTPUT")
          catalog_sha=$(jq -r '.content_sha256' "$CATALOG_OUTPUT")
          source_sha=$(jq -r '.source_catalog.content_sha256' "$QUESTIONS_OUTPUT")
          content_sha=$(jq -r '.content_sha256' "$QUESTIONS_OUTPUT")
          bytes=$(wc -c < "$QUESTIONS_OUTPUT")
          test "$directions" -gt 310
          test "$questions" -eq "$directions"
          test "$declared" -eq "$directions"
          test "$source_sha" = "$catalog_sha"
          [[ "$content_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$bytes" -gt 0
          test "$bytes" -le 12582912

      - name: Preserve expanded question artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-question-candidates-${{ steps.corpus.outputs.tag }}
          path: ${{ env.QUESTIONS_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish compact catalog
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha=$(git rev-parse HEAD)
          git add "$CATALOG_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update full-corpus research catalog"
          git fetch origin main
          remote_sha=$(git rev-parse FETCH_HEAD)
          if [ "$remote_sha" != "$base_sha" ]; then
            echo "Main changed during catalog generation; restart from the new base" >&2
            exit 1
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summarize complete catalog
        run: |
          jq '{corpus, coverage, counts}' "$CATALOG_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          jq '{source_catalog, counts, content_sha256}' "$QUESTIONS_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Certify published catalog
        if: steps.publish.outputs.changed == 'true'
        run: gh workflow run check.yml --ref main
