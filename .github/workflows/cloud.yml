name: cloud

on:
  workflow_dispatch:

concurrency:
  group: arxiv-cloud
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  points:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_ROOT: data/cache/archive
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev.txt
            cloud.txt

      - name: Install semantic runtime
        run: python -m pip install -r dev.txt -r cloud.txt

      - name: Select corpus release
        id: corpus
        run: |
          if gh release view corpus-v2 >/dev/null 2>&1; then
            echo "corpus-v2 owns the published cloud; legacy publication is disabled" >&2
            exit 1
          fi
          tag=corpus-v1
          mkdir -p "$ARCHIVE_ROOT"
          gh release download "$tag" \
            --pattern index.json \
            --dir "$ARCHIVE_ROOT" \
            --clobber
          jq -e '
            .schema_version == 1 and
            (.shards | type == "array") and
            (.counts.all | type == "number") and
            ([.shards[].month] == ([.shards[].month] | sort | unique))
          ' "$ARCHIVE_ROOT/index.json" >/dev/null
          digest=$(sha256sum "$ARCHIVE_ROOT/index.json" | awk '{print $1}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore vector cache
        id: vectors
        uses: actions/cache/restore@v4
        with:
          path: data/cache/cloud
          key: cloud-${{ runner.os }}-${{ steps.corpus.outputs.digest }}-${{ github.run_id }}
          restore-keys: |
            cloud-${{ runner.os }}-${{ steps.corpus.outputs.digest }}-
            cloud-${{ runner.os }}-

      - name: Read changed months
        env:
          ARCHIVE_TAG: ${{ steps.corpus.outputs.tag }}
        run: |
          needed="$RUNNER_TEMP/cloud-needed.tsv"
          : > "$needed"
          jq -r '.shards[] | [.month, .path, .sha256] | @tsv' \
            "$ARCHIVE_ROOT/index.json" | while IFS=$'\t' read -r month path digest; do
            if [[ ! "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]] || \
              [[ ! "$path" =~ ^[0-9]{4}-[0-9]{2}(-[0-9a-f]{16})?\.json\.gz$ ]]; then
              echo "Invalid corpus shard identity: $month $path" >&2
              exit 1
            fi
            saved=""
            point_path=""
            point_sha=""
            meta_path=""
            meta_sha=""
            route_path=""
            route_sha=""
            anchor_sha=""
            if [ -f web/public/data/cloud/index.json ]; then
              saved=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .source_sha256 // empty' \
                web/public/data/cloud/index.json)
              point_path=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .points.path // empty' \
                web/public/data/cloud/index.json)
              point_sha=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .points.sha256 // empty' \
                web/public/data/cloud/index.json)
              meta_path=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .meta.path // empty' \
                web/public/data/cloud/index.json)
              meta_sha=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .meta.sha256 // empty' \
                web/public/data/cloud/index.json)
              route_path=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .routes.path // empty' \
                web/public/data/cloud/index.json)
              route_sha=$(jq -r --arg month "$month" \
                '.shards[] | select(.month == $month) | .routes.sha256 // empty' \
                web/public/data/cloud/index.json)
              anchor_sha=$(jq -r '.anchor_sha256 // empty' \
                web/public/data/cloud/index.json)
            fi
            if [ "$saved" = "$digest" ] && \
              [ "$anchor_sha" = "$(sha256sum data/source/anchors.npz | awk '{print $1}')" ] && \
              [ "$point_path" = "$month.bin" ] && \
              [ "$meta_path" = "$month.json" ] && \
              [ "$route_path" = "$month.routes" ] && \
              [[ "$point_sha" =~ ^[0-9a-f]{64}$ ]] && \
              [[ "$meta_sha" =~ ^[0-9a-f]{64}$ ]] && \
              [[ "$route_sha" =~ ^[0-9a-f]{64}$ ]] && \
              [ -f "web/public/data/cloud/$point_path" ] && \
              [ -f "web/public/data/cloud/$meta_path" ] && \
              [ -f "web/public/data/cloud/$route_path" ]; then
              if [ "$(sha256sum "web/public/data/cloud/$point_path" | awk '{print $1}')" = "$point_sha" ] && \
                [ "$(sha256sum "web/public/data/cloud/$meta_path" | awk '{print $1}')" = "$meta_sha" ] && \
                [ "$(sha256sum "web/public/data/cloud/$route_path" | awk '{print $1}')" = "$route_sha" ]; then
                continue
              fi
            fi
            printf '%s\t%s\t%s\n' "$month" "$path" "$digest" >> "$needed"
          done
          download="$RUNNER_TEMP/cloud-source"
          mkdir -p "$download"
          if [ -s "$needed" ]; then
            gh release download "$ARCHIVE_TAG" \
              --pattern '*.json.gz' \
              --dir "$download" \
              --clobber
          fi
          while IFS=$'\t' read -r month path digest; do
            if [ ! -f "$download/$path" ]; then
              gh release download "$ARCHIVE_TAG" \
                --pattern "$path" \
                --dir "$download" \
                --clobber
            fi
            test "$(sha256sum "$download/$path" | awk '{print $1}')" = "$digest"
            mv "$download/$path" "$ARCHIVE_ROOT/$month.json.gz"
          done < "$needed"

      - name: Normalize legacy corpus shards
        run: |
          needed="$RUNNER_TEMP/cloud-needed.tsv"
          if [ -s "$needed" ]; then
            download="$RUNNER_TEMP/cloud-source"
            jq -r '.shards[] | [.month, .path, .sha256] | @tsv' \
              "$ARCHIVE_ROOT/index.json" | while IFS=$'\t' read -r month path digest; do
              target="$ARCHIVE_ROOT/$month.json.gz"
              if [ ! -f "$target" ]; then
                test -f "$download/$path"
                test "$(sha256sum "$download/$path" | awk '{print $1}')" = "$digest"
                mv "$download/$path" "$target"
              fi
              test "$(sha256sum "$target" | awk '{print $1}')" = "$digest"
            done
            PYTHONPATH=pipeline python - <<'PY'
          from pathlib import Path
          from archive import migrate_archive, write_manifest

          root = Path("data/cache/archive")
          migrate_archive(root)
          write_manifest(root)
          PY
          fi

      - name: Build semantic points
        id: build
        continue-on-error: true
        timeout-minutes: 300
        run: python pipeline/cloud.py --provider native

      - name: Save vector checkpoint
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/cache/cloud
          key: cloud-${{ runner.os }}-${{ steps.corpus.outputs.digest }}-${{ github.run_id }}

      - name: Verify point contracts
        if: steps.build.outcome == 'success'
        run: |
          python pipeline/cloud.py --check
          python -m unittest tests.test_cloud tests.test_architecture -v
          ruff check pipeline tests
          ruff format --check pipeline tests
          npm --prefix web ci
          npm --prefix web test -- --run src/lib/cloud.test.ts src/lib/swarm.test.ts
          npm --prefix web run build

      - name: Publish point shards
        id: publish
        if: steps.build.outcome == 'success'
        env:
          ARCHIVE_TAG: ${{ steps.corpus.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/cloud
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update semantic cloud from $ARCHIVE_TAG"
          pushed=false
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
          done
          test "$pushed" = true
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy published cloud
        if: steps.publish.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main

      - name: Enforce cloud result
        if: steps.build.outcome == 'failure'
        run: exit 1
