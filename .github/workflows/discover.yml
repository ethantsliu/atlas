name: discover

on:
  repository_dispatch:
    types: [corpus-promoted]
  schedule:
    - cron: "27 09 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Promoted corpus release tag"
        required: false
        default: "corpus-v2"
        type: string
      scope:
        description: "Corpus shards to inspect"
        required: true
        default: "all"
        type: choice
        options:
          - latest
          - all

permissions:
  contents: read

concurrency:
  group: atlas-discovery
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_TAG: ${{ github.event.client_payload.tag }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_SCOPE: ${{ inputs.scope }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install discovery checks
        run: python -m pip install -r dev.txt

      - name: Initialize paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ARCHIVE_ROOT=$RUNNER_TEMP/atlas-archive" >> "$GITHUB_ENV"
          echo "OUTPUT_PATH=$RUNNER_TEMP/atlas-discovery/candidates.json" >> "$GITHUB_ENV"

      - name: Read promoted corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-${ATLAS_CORPUS_TAG:-corpus-v2}}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid promoted corpus tag" >&2
            exit 1
          fi
          mkdir -p "$ARCHIVE_ROOT"
          probe="$RUNNER_TEMP/atlas-release.txt"
          if ! gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            > "$probe" 2>&1; then
            status=$(awk '/^HTTP/{code=$2} END{print code}' "$probe")
            if [ "$status" != "404" ]; then
              echo "Could not inspect promoted corpus release" >&2
              exit 1
            else
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "No promoted corpus release named $tag; discovery has no work."
              exit 0
            fi
          fi
          gh release download "$tag" \
            --pattern index.json \
            --dir "$ARCHIVE_ROOT" \
            --clobber
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "generation=$tag" >> "$GITHUB_OUTPUT"
          printf '### Discovery corpus\n\n- Generation: `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Select corpus shards
        if: steps.corpus.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest="$ARCHIVE_ROOT/index.json"
          jq -e '.schema_version == 1 and (.shards | type == "array")' "$manifest" >/dev/null
          requested="$RUNNER_TEMP/atlas-months.txt"
          scope="${INPUT_SCOPE:-all}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$scope" = "latest" ]; then
            jq -r '.shards[-1].month // empty' "$manifest" > "$requested"
          else
            jq -r '.shards[].month' "$manifest" > "$requested"
          fi
          sort -u "$requested" -o "$requested"
          while IFS= read -r month; do
            if [[ ! "$month" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              echo "Invalid promoted corpus month: $month" >&2
              exit 1
            fi
            path=$(jq -er --arg month "$month" \
              '.shards[] | select(.month == $month) | .path' "$manifest")
            if [[ ! "$path" =~ ^[0-9]{4}-[0-9]{2}(-[0-9a-f]{16})?\.json\.gz$ ]]; then
              echo "Invalid promoted shard path: $path" >&2
              exit 1
            fi
            gh release download "${{ steps.corpus.outputs.tag }}" \
              --pattern "$path" \
              --dir "$ARCHIVE_ROOT" \
              --clobber
          done < "$requested"

      - name: Build provisional candidates
        if: steps.corpus.outputs.present == 'true'
        run: |
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          python pipeline/discover.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$OUTPUT_PATH"

      - name: Validate candidate contracts
        if: steps.corpus.outputs.present == 'true'
        run: |
          test -s "$OUTPUT_PATH"
          python pipeline/discover.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$OUTPUT_PATH" \
            --check
          python -m unittest \
            tests.test_candidate \
            tests.test_scan \
            tests.test_retrieve \
            tests.test_synth \
            tests.test_safety \
            tests.test_privacy \
            tests.test_discover \
            tests.test_architecture \
            -v

      - name: Publish candidate artifact
        if: steps.corpus.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-candidates-${{ github.run_id }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 30
