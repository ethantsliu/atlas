name: probe

on:
  schedule:
    - cron: "43 07 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Public atlas root; blank uses ATLAS_SITE_URL or project Pages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-probe
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe anonymous release
        env:
          INPUT_URL: ${{ inputs.url }}
          SITE_URL: ${{ vars.ATLAS_SITE_URL }}
        run: |
          target="$INPUT_URL"
          if [ -z "$target" ]; then target="$SITE_URL"; fi
          if [ -z "$target" ]; then
            target="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          python3 pipeline/probe.py --base-url "$target"
