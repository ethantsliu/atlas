name: methods

on:
  repository_dispatch:
    types: [corpus-promoted]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Promoted corpus release tag"
        required: false
        default: "corpus-v2"
        type: string
      minimum_support:
        description: "Minimum distinct supporting papers"
        required: true
        default: 3
        type: number

permissions:
  contents: read

concurrency:
  group: atlas-methods
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_TAG: ${{ github.event.client_payload.tag }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_SUPPORT: ${{ inputs.minimum_support }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r dev.txt

      - name: Download complete promoted corpus
        id: corpus
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-${ATLAS_CORPUS_TAG:-corpus-v2}}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid promoted corpus tag" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/atlas-methods-archive"
          output="$RUNNER_TEMP/atlas-methods-artifact"
          mkdir -p "$archive" "$output"
          echo "ARCHIVE_ROOT=$archive" >> "$GITHUB_ENV"
          echo "OUTPUT_ROOT=$output" >> "$GITHUB_ENV"
          gh release download "$tag" --pattern index.json --dir "$archive" --clobber
          jq -r '.shards[].path' "$archive/index.json" > "$RUNNER_TEMP/method-assets.txt"
          while IFS= read -r path; do
            if [[ ! "$path" =~ ^[0-9]{4}-[0-9]{2}(-[0-9a-f]{16})?\.json\.gz$ ]]; then
              echo "Invalid promoted shard path: $path" >&2
              exit 1
            fi
            gh release download "$tag" --pattern "$path" --dir "$archive" --clobber
          done < "$RUNNER_TEMP/method-assets.txt"

      - name: Extract open-vocabulary method candidates
        shell: bash
        timeout-minutes: 180
        run: |
          set -euo pipefail
          support="${INPUT_SUPPORT:-3}"
          if [[ ! "$support" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid minimum support" >&2
            exit 1
          fi
          python pipeline/methods.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$OUTPUT_ROOT" \
            --min-support "$support"

      - name: Preserve unvalidated method candidates
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: atlas-method-candidates-unvalidated-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 1

      - name: Validate method candidate contracts
        timeout-minutes: 120
        run: |
          python pipeline/methods.py \
            --archive "$ARCHIVE_ROOT" \
            --output "$OUTPUT_ROOT" \
            --check
          python -m unittest tests.test_methods tests.test_architecture -v

      - name: Summarize extraction
        run: jq '{corpus, extraction, coverage}' "$OUTPUT_ROOT/index.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-method-candidates-${{ github.run_id }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 30
