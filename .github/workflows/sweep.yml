name: sweep

on:
  workflow_dispatch:

# Every OAI checkpoint and promoted-corpus writer uses this one lock. The
# historical sweep is intentionally one polite arXiv connection, not a matrix.
concurrency:
  group: arxiv-oai-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      through: ${{ steps.range.outputs.through }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix sweep boundary
        id: range
        run: |
          through=$(date -u +%F)
          echo "through=$through" >> "$GITHUB_OUTPUT"
          echo "SWEEP_ROOT=$RUNNER_TEMP/arxiv-sweep" >> "$GITHUB_ENV"
      - name: Harvest missing history prefix
        run: |
          set -o pipefail
          python pipeline/sweep.py harvest \
            --root "$SWEEP_ROOT" \
            --start-year 2005 \
            --end-year 2018 \
            --through "${{ steps.range.outputs.through }}" \
            | tee "$RUNNER_TEMP/sweep-result.json"
          test -s "$RUNNER_TEMP/sweep-result.json"
          test -n "$(find "$SWEEP_ROOT" -type f -print -quit)"
      - name: Stage sealed sweep
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-sweep-${{ github.run_id }}
          path: |
            ${{ env.SWEEP_ROOT }}
            ${{ runner.temp }}/sweep-result.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_ROOT: data/cache/corpus
      CHECKPOINT_TAG: oai-corpus-v1
      THROUGH: ${{ needs.harvest.outputs.through }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify retention
        run: python -m unittest tests.test_reap -v
      - name: Initialize paths
        run: |
          echo "SWEEP_ROOT=$RUNNER_TEMP/sweep/arxiv-sweep" >> "$GITHUB_ENV"
          echo "CORPUS_FILE=$RUNNER_TEMP/corpus.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ROOT=$RUNNER_TEMP/corpus-checkpoint" >> "$GITHUB_ENV"
          echo "CHECKPOINT_POINTER=$RUNNER_TEMP/corpus-checkpoint/checkpoint.json" >> "$GITHUB_ENV"
          echo "PRIOR_POINTER=$RUNNER_TEMP/corpus-checkpoint/prior.json" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: arxiv-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep

      - name: Restore canonical checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-parts" "$CHECKPOINT_ROOT"
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.created_at, .name] | @tsv' \
            | awk -F '\t' '$2 ~ /^pointer-[0-9]+-[0-9]+-[0-9a-f]{16}\.json$/ {print}' \
            | sort -r > "$RUNNER_TEMP/checkpoint-pointers.tsv"
          pointer=$(awk -F '\t' 'NR == 1 {print $2}' \
            "$RUNNER_TEMP/checkpoint-pointers.tsv")
          test -n "$pointer"
          echo "PRIOR_NAME=$pointer" >> "$GITHUB_ENV"
          gh release download "$CHECKPOINT_TAG" \
            --pattern "$pointer" \
            --dir "$RUNNER_TEMP/corpus-parts"
          cp "$RUNNER_TEMP/corpus-parts/$pointer" "$PRIOR_POINTER"
          jq -e '
            .schema_version == 1 and
            (.archive_sha256 | test("^[0-9a-f]{64}$")) and
            (.archive_bytes | type == "number" and . > 0) and
            (.parts | type == "array" and length > 0) and
            all(.parts[];
              (.name | test("^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\\.part$")) and
              (.sha256 | test("^[0-9a-f]{64}$")) and
              (.bytes | type == "number" and . > 0))
          ' "$PRIOR_POINTER" >/dev/null
          patterns=()
          while read -r name; do
            patterns+=(--pattern "$name")
          done < <(jq -r '.parts[].name' "$PRIOR_POINTER")
          gh release download "$CHECKPOINT_TAG" \
            "${patterns[@]}" \
            --dir "$RUNNER_TEMP/corpus-parts"
          jq -c '.parts[]' "$PRIOR_POINTER" | while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            digest=$(jq -r '.sha256' <<<"$row")
            test "$(sha256sum "$RUNNER_TEMP/corpus-parts/$name" | awk '{print $1}')" = \
              "$digest"
          done
          jq -r '.parts[].name' "$PRIOR_POINTER" | while read -r name; do
            cat "$RUNNER_TEMP/corpus-parts/$name"
          done > "$CORPUS_FILE"
          test "$(sha256sum "$CORPUS_FILE" | awk '{print $1}')" = \
            "$(jq -r '.archive_sha256' "$PRIOR_POINTER")"
          test "$(stat -c %s "$CORPUS_FILE")" = \
            "$(jq -r '.archive_bytes' "$PRIOR_POINTER")"
          python pipeline/corpus.py unpack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"

      - name: Attach sealed sweep
        run: |
          set -o pipefail
          test -n "$(find "$SWEEP_ROOT" -type f -print -quit)"
          python pipeline/sweep.py attach \
            --source "$SWEEP_ROOT" \
            --root "$CORPUS_ROOT" \
            --start-year 2005 \
            --end-year 2018 \
            --through "$THROUGH" \
            | tee "$RUNNER_TEMP/sweep-attach.json"
          python pipeline/corpus.py check --root "$CORPUS_ROOT" --stage-only

      - name: Package canonical checkpoint
        id: package
        run: |
          python pipeline/corpus.py pack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"
          mkdir -p "$CHECKPOINT_ROOT/raw"
          split -b 450m -d -a 4 "$CORPUS_FILE" "$CHECKPOINT_ROOT/raw/part-"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def file_hash(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path(os.environ["CHECKPOINT_ROOT"])
          archive = Path(os.environ["CORPUS_FILE"])
          archive_hash = file_hash(archive)
          parts = []
          for index, path in enumerate(sorted((root / "raw").glob("part-*"))):
              digest = file_hash(path)
              name = f"checkpoint-{archive_hash[:16]}-{index:04d}-{digest[:16]}.part"
              target = root / name
              path.replace(target)
              parts.append({
                  "name": name,
                  "sha256": digest,
                  "bytes": target.stat().st_size,
              })
          prior = json.loads(Path(os.environ["PRIOR_POINTER"]).read_text())
          keep = sorted({row["name"] for row in parts} | {
              row["name"] for row in prior["parts"]
          })
          pointer = {
              "schema_version": 1,
              "archive_sha256": archive_hash,
              "archive_bytes": archive.stat().st_size,
              "parts": parts,
              "keep": keep,
          }
          Path(os.environ["CHECKPOINT_POINTER"]).write_text(
              json.dumps(pointer, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Stage canonical checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: corpus-checkpoint-${{ github.run_id }}
          path: |
            ${{ env.CHECKPOINT_POINTER }}
            ${{ env.CHECKPOINT_ROOT }}/checkpoint-*.part
            ${{ runner.temp }}/sweep-attach.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Publish canonical checkpoint
        id: checkpoint
        run: |
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          reserve=$(jq '.parts | length + 1' "$CHECKPOINT_POINTER")
          if [ "$reserve" -gt 900 ]; then
            echo "Checkpoint exceeds the safe release-asset budget." >&2
            exit 1
          fi
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | {id,name,created_at,state} | @json' \
            > "$RUNNER_TEMP/checkpoint-prior.jsonl"
          python pipeline/reap.py point \
            --assets "$RUNNER_TEMP/checkpoint-prior.jsonl" \
            --pointer "$PRIOR_POINTER" \
            --current "$PRIOR_NAME" \
            --reserve "$reserve" \
            > "$RUNNER_TEMP/checkpoint-prior-reap.json"
          while read -r id; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(jq -r '.delete[]' "$RUNNER_TEMP/checkpoint-prior-reap.json")
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, (.digest // "")] | @tsv' \
            > "$RUNNER_TEMP/checkpoint-assets.tsv"
          missing=()
          while IFS=$'\t' read -r name digest; do
            api_digest=$(awk -F '\t' -v asset="$name" \
              '$2 == asset {print $3; exit}' "$RUNNER_TEMP/checkpoint-assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            if grep -q $'\t'"$name"$'\t' "$RUNNER_TEMP/checkpoint-assets.tsv"; then
              echo "Checkpoint asset collides with different content: $name" >&2
              exit 1
            fi
            missing+=("$CHECKPOINT_ROOT/$name")
          done < <(jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER")
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$CHECKPOINT_TAG" "${missing[@]}"
          fi
          archive_digest=$(jq -r '.archive_sha256' "$CHECKPOINT_POINTER")
          pointer="pointer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${archive_digest:0:16}.json"
          cp "$CHECKPOINT_POINTER" "$CHECKPOINT_ROOT/$pointer"
          gh release upload "$CHECKPOINT_TAG" "$CHECKPOINT_ROOT/$pointer"
          verify="$RUNNER_TEMP/checkpoint-verify"
          mkdir -p "$verify"
          gh release download "$CHECKPOINT_TAG" \
            --pattern "$pointer" \
            --dir "$verify"
          cmp "$CHECKPOINT_POINTER" "$verify/$pointer"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, (.digest // "")] | @tsv' \
            > "$verify/assets.tsv"
          jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER" \
            | while IFS=$'\t' read -r name digest; do
                test "$(awk -F '\t' -v asset="$name" \
                  '$2 == asset {print $3; exit}' "$verify/assets.tsv")" = \
                  "sha256:$digest"
              done
          while IFS=$'\t' read -r id name _digest; do
            if [[ ! "$name" =~ ^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\.part$ ]]; then
              continue
            fi
            if ! jq -e --arg name "$name" '.keep | index($name)' \
              "$CHECKPOINT_POINTER" >/dev/null; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done < "$verify/assets.tsv"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | {id,name,created_at,state} | @json' \
            > "$verify/assets.jsonl"
          python pipeline/reap.py point \
            --assets "$verify/assets.jsonl" \
            --pointer "$CHECKPOINT_POINTER" \
            --current "$pointer" \
            > "$verify/reap.json"
          while read -r id; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(jq -r '.delete[]' "$verify/reap.json")

      - name: Dispatch consolidation
        if: steps.checkpoint.outcome == 'success'
        run: |
          gh workflow run corpus.yml \
            -f mode=merge \
            -f pages=5000 \
            -f minutes=180

      - name: Enforce atomic result
        if: always()
        env:
          PACKAGED: ${{ steps.package.outcome }}
          CHECKPOINTED: ${{ steps.checkpoint.outcome }}
        run: |
          test "$PACKAGED" = success
          test "$CHECKPOINTED" = success
