name: sweep

on:
  workflow_dispatch:

# Every OAI checkpoint and promoted-corpus writer uses this one lock. The
# historical sweep is intentionally one polite arXiv connection, not a matrix.
concurrency:
  group: arxiv-oai-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      through: ${{ steps.range.outputs.through }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix sweep boundary
        id: range
        run: |
          echo "through=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "SWEEP_ROOT=$RUNNER_TEMP/arxiv-sweep" >> "$GITHUB_ENV"
      - name: Harvest recent history
        run: |
          python pipeline/sweep.py harvest \
            --root "$SWEEP_ROOT" \
            --start-year 2019 \
            --end-year 2026 \
            --through "${{ steps.range.outputs.through }}" \
            | tee "$RUNNER_TEMP/sweep-result.json"
          test -s "$RUNNER_TEMP/sweep-result.json"
          test -n "$(find "$SWEEP_ROOT" -type f -print -quit)"
      - name: Stage sealed sweep
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-sweep-${{ github.run_id }}
          path: |
            ${{ env.SWEEP_ROOT }}
            ${{ runner.temp }}/sweep-result.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_ROOT: data/cache/corpus
      CORPUS_ARCHIVE: data/cache/corpus/archive
      CHECKPOINT_TAG: oai-corpus-v1
      PROMOTED_TAG: corpus-v2
      MIN_READY: 1000000
      THROUGH: ${{ needs.harvest.outputs.through }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Initialize paths
        run: |
          echo "SWEEP_ROOT=$RUNNER_TEMP/sweep" >> "$GITHUB_ENV"
          echo "CORPUS_FILE=$RUNNER_TEMP/corpus.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ROOT=$RUNNER_TEMP/corpus-checkpoint" >> "$GITHUB_ENV"
          echo "CHECKPOINT_POINTER=$RUNNER_TEMP/corpus-checkpoint/checkpoint.json" >> "$GITHUB_ENV"
          echo "PRIOR_POINTER=$RUNNER_TEMP/corpus-checkpoint/prior.json" >> "$GITHUB_ENV"
          echo "PROMO_ROOT=$RUNNER_TEMP/corpus-promo" >> "$GITHUB_ENV"
          echo "PRIOR_ROOT=$RUNNER_TEMP/corpus-prior" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: arxiv-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep

      - name: Restore canonical checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/corpus-parts" "$CHECKPOINT_ROOT"
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.created_at, .name] | @tsv' \
            | awk -F '\t' '$2 ~ /^pointer-[0-9]+-[0-9]+-[0-9a-f]{16}\.json$/ {print}' \
            | sort -r > "$RUNNER_TEMP/checkpoint-pointers.tsv"
          pointer=$(awk -F '\t' 'NR == 1 {print $2}' \
            "$RUNNER_TEMP/checkpoint-pointers.tsv")
          test -n "$pointer"
          gh release download "$CHECKPOINT_TAG" \
            --pattern "$pointer" \
            --dir "$RUNNER_TEMP/corpus-parts"
          cp "$RUNNER_TEMP/corpus-parts/$pointer" "$PRIOR_POINTER"
          jq -e '
            .schema_version == 1 and
            (.archive_sha256 | test("^[0-9a-f]{64}$")) and
            (.archive_bytes | type == "number" and . > 0) and
            (.parts | type == "array" and length > 0) and
            all(.parts[];
              (.name | test("^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\\.part$")) and
              (.sha256 | test("^[0-9a-f]{64}$")) and
              (.bytes | type == "number" and . > 0))
          ' "$PRIOR_POINTER" >/dev/null
          patterns=()
          while read -r name; do
            patterns+=(--pattern "$name")
          done < <(jq -r '.parts[].name' "$PRIOR_POINTER")
          gh release download "$CHECKPOINT_TAG" \
            "${patterns[@]}" \
            --dir "$RUNNER_TEMP/corpus-parts"
          jq -c '.parts[]' "$PRIOR_POINTER" | while read -r row; do
            name=$(jq -r '.name' <<<"$row")
            digest=$(jq -r '.sha256' <<<"$row")
            test "$(sha256sum "$RUNNER_TEMP/corpus-parts/$name" | awk '{print $1}')" = \
              "$digest"
          done
          jq -r '.parts[].name' "$PRIOR_POINTER" | while read -r name; do
            cat "$RUNNER_TEMP/corpus-parts/$name"
          done > "$CORPUS_FILE"
          test "$(sha256sum "$CORPUS_FILE" | awk '{print $1}')" = \
            "$(jq -r '.archive_sha256' "$PRIOR_POINTER")"
          test "$(stat -c %s "$CORPUS_FILE")" = \
            "$(jq -r '.archive_bytes' "$PRIOR_POINTER")"
          python pipeline/corpus.py unpack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"

      - name: Attach sealed sweep
        run: |
          test -n "$(find "$SWEEP_ROOT" -type f -print -quit)"
          python pipeline/sweep.py attach \
            --source "$SWEEP_ROOT" \
            --root "$CORPUS_ROOT" \
            --start-year 2019 \
            --end-year 2026 \
            --through "$THROUGH" \
            | tee "$RUNNER_TEMP/sweep-attach.json"
          python pipeline/corpus.py check --root "$CORPUS_ROOT" --stage-only

      - name: Consolidate generations
        id: merge
        run: |
          python pipeline/corpus.py merge \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_ARCHIVE" \
            --rules data/source/feed.json \
            | tee "$RUNNER_TEMP/corpus-merge.json"
          test "$(jq -r '.history.complete' "$CORPUS_ROOT/cursor.json")" = true
          test "$(jq -r '.history.next_year' "$CORPUS_ROOT/cursor.json")" -ge 2027
          test "$(jq -r '.counts.all' "$CORPUS_ARCHIVE/index.json")" -ge "$MIN_READY"

      - name: Read prior promotion
        run: |
          mkdir -p "$PRIOR_ROOT"
          if gh release view "$PROMOTED_TAG" >/dev/null 2>&1; then
            gh release download "$PROMOTED_TAG" \
              --pattern index.json \
              --dir "$PRIOR_ROOT"
          fi

      - name: Prepare promotion
        id: prep
        run: |
          args=(--archive "$CORPUS_ARCHIVE" --output "$PROMO_ROOT")
          if [ -f "$PRIOR_ROOT/index.json" ]; then
            args+=(--prior "$PRIOR_ROOT/index.json")
          fi
          python pipeline/corpus.py prep "${args[@]}" \
            | tee "$RUNNER_TEMP/corpus-promo.json"
          paper_count=$(jq -r '.counts.all' "$PROMO_ROOT/index.json")
          test "$paper_count" -ge "$MIN_READY"
          test "$paper_count" = \
            "$(jq -r '.counts.all' "$CORPUS_ARCHIVE/index.json")"
          index_sha=$(sha256sum "$PROMO_ROOT/index.json" | awk '{print $1}')
          jq -n \
            --arg index_sha256 "$index_sha" \
            --argjson paper_count "$paper_count" \
            '{schema_version:1,snapshot_complete:true,history_complete:true,
              coverage_through_year:2026,index_sha256:$index_sha256,
              paper_count:$paper_count}' \
            > "$PROMO_ROOT/cloud-ready.json"
          if [ "$(jq '.months | length' "$PROMO_ROOT/plan.json")" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish immutable shards
        if: steps.prep.outputs.changed == 'true'
        run: |
          gh release view "$PROMOTED_TAG" >/dev/null 2>&1 || \
            gh release create "$PROMOTED_TAG" \
              --title "Atlas corpus v2" \
              --notes "Official arXiv OAI metadata shards used by Atlas."
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' \
            > "$RUNNER_TEMP/promo-assets.tsv"
          mkdir -p "$RUNNER_TEMP/promo-existing"
          missing=()
          while read -r asset; do
            digest=$(jq -r --arg path "$asset" \
              '.shards[] | select(.path == $path) | .sha256' \
              "$PROMO_ROOT/index.json")
            api_digest=$(awk -F '\t' -v name="$asset" \
              '$1 == name {print $2; exit}' "$RUNNER_TEMP/promo-assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            if grep -q "^$asset"$'\t' "$RUNNER_TEMP/promo-assets.tsv"; then
              gh release download "$PROMOTED_TAG" \
                --pattern "$asset" \
                --dir "$RUNNER_TEMP/promo-existing"
              test "$(sha256sum "$RUNNER_TEMP/promo-existing/$asset" | awk '{print $1}')" = \
                "$digest"
              continue
            fi
            missing+=("$PROMO_ROOT/$asset")
          done < <(jq -r '.assets[]' "$PROMO_ROOT/plan.json")
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$PROMOTED_TAG" "${missing[@]}"
          fi

      - name: Swap promotion pointers
        if: steps.prep.outputs.changed == 'true'
        run: |
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // ""), .id] | @tsv' \
            > "$RUNNER_TEMP/promo-swap.tsv"
          swap_asset() {
            local source="$1" stable="$2" stem="$3"
            local digest recovery stable_digest candidate stable_id candidate_id prior
            digest=$(sha256sum "$source" | awk '{print $1}')
            recovery="${stem}-${digest:0:16}.json"
            cp "$source" "$PROMO_ROOT/$recovery"
            if ! grep -q "^$recovery"$'\t' "$RUNNER_TEMP/promo-swap.tsv"; then
              gh release upload "$PROMOTED_TAG" "$PROMO_ROOT/$recovery"
            else
              test "$(awk -F '\t' -v name="$recovery" \
                '$1 == name {print $2; exit}' "$RUNNER_TEMP/promo-swap.tsv")" = \
                "sha256:$digest"
            fi
            stable_digest=$(awk -F '\t' -v name="$stable" \
              '$1 == name {print $2; exit}' "$RUNNER_TEMP/promo-swap.tsv")
            if [ "$stable_digest" = "sha256:$digest" ]; then
              return
            fi
            candidate="next-${stem}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${digest:0:16}.json"
            cp "$source" "$PROMO_ROOT/$candidate"
            gh release upload "$PROMOTED_TAG" "$PROMO_ROOT/$candidate"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | [.name, (.digest // ""), .id] | @tsv' \
              > "$RUNNER_TEMP/promo-next.tsv"
            stable_id=$(awk -F '\t' -v name="$stable" \
              '$1 == name {print $3; exit}' "$RUNNER_TEMP/promo-next.tsv")
            if [ -n "$stable_id" ]; then
              prior=$(awk -F '\t' -v name="$stable" \
                '$1 == name {print $2; exit}' "$RUNNER_TEMP/promo-next.tsv" \
                | sed 's/^sha256://')
              prior="${prior:-unknown}"
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/assets/$stable_id" \
                -f name="old-${stem}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${prior:0:16}.json" \
                >/dev/null
            fi
            candidate_id=$(awk -F '\t' -v name="$candidate" \
              '$1 == name {print $3; exit}' "$RUNNER_TEMP/promo-next.tsv")
            test -n "$candidate_id"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/assets/$candidate_id" \
              -f name="$stable" >/dev/null
          }
          swap_asset "$PROMO_ROOT/index.json" index.json index
          swap_asset "$PROMO_ROOT/cloud-ready.json" cloud-ready.json ready

      - name: Verify promotion
        id: verify
        if: steps.prep.outputs.changed == 'true'
        run: |
          verify="$RUNNER_TEMP/corpus-verify"
          mkdir -p "$verify"
          index_sha=$(sha256sum "$PROMO_ROOT/index.json" | awk '{print $1}')
          ready_sha=$(sha256sum "$PROMO_ROOT/cloud-ready.json" | awk '{print $1}')
          gh release download "$PROMOTED_TAG" \
            --pattern index.json \
            --pattern "index-${index_sha:0:16}.json" \
            --pattern cloud-ready.json \
            --pattern "ready-${ready_sha:0:16}.json" \
            --dir "$verify"
          cmp "$PROMO_ROOT/index.json" "$verify/index.json"
          cmp "$verify/index.json" "$verify/index-${index_sha:0:16}.json"
          cmp "$PROMO_ROOT/cloud-ready.json" "$verify/cloud-ready.json"
          cmp "$verify/cloud-ready.json" "$verify/ready-${ready_sha:0:16}.json"
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$PROMOTED_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name, (.digest // "")] | @tsv' > "$verify/assets.tsv"
          jq -r '.shards[] | [.path, .sha256] | @tsv' "$verify/index.json" \
            | while IFS=$'\t' read -r asset digest; do
                test "$(awk -F '\t' -v name="$asset" \
                  '$1 == name {print $2; exit}' "$verify/assets.tsv")" = \
                  "sha256:$digest"
              done

      - name: Dispatch cloud build
        if: steps.prep.outputs.changed == 'true' && steps.verify.outcome == 'success'
        run: |
          index_sha=$(sha256sum "$PROMO_ROOT/index.json" | awk '{print $1}')
          ready_sha=$(sha256sum "$PROMO_ROOT/cloud-ready.json" | awk '{print $1}')
          jq -n \
            --arg tag "$PROMOTED_TAG" \
            --arg index_sha256 "$index_sha" \
            --arg ready_sha256 "$ready_sha" \
            --slurpfile plan "$PROMO_ROOT/plan.json" \
            '{event_type:"corpus-promoted",client_payload:{
              tag:$tag,index_sha256:$index_sha256,ready_sha256:$ready_sha256,
              months:$plan[0].months
            }}' > "$RUNNER_TEMP/corpus-dispatch.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/corpus-dispatch.json"

      - name: Acknowledge generations
        run: |
          args=()
          while read -r generation; do
            args+=(--generation "$generation")
          done < <(jq -r '.pending[]' "$RUNNER_TEMP/corpus-merge.json")
          if [ "${#args[@]}" -gt 0 ]; then
            python pipeline/corpus.py ack --root "$CORPUS_ROOT" "${args[@]}"
          fi

      - name: Package canonical checkpoint
        id: package
        run: |
          python pipeline/corpus.py pack \
            --root "$CORPUS_ROOT" \
            --archive "$CORPUS_FILE"
          mkdir -p "$CHECKPOINT_ROOT/raw"
          split -b 1800m -d -a 4 "$CORPUS_FILE" "$CHECKPOINT_ROOT/raw/part-"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def file_hash(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path(os.environ["CHECKPOINT_ROOT"])
          archive = Path(os.environ["CORPUS_FILE"])
          archive_hash = file_hash(archive)
          parts = []
          for index, path in enumerate(sorted((root / "raw").glob("part-*"))):
              digest = file_hash(path)
              name = f"checkpoint-{archive_hash[:16]}-{index:04d}-{digest[:16]}.part"
              target = root / name
              path.replace(target)
              parts.append({
                  "name": name,
                  "sha256": digest,
                  "bytes": target.stat().st_size,
              })
          prior = json.loads(Path(os.environ["PRIOR_POINTER"]).read_text())
          keep = sorted({row["name"] for row in parts} | {
              row["name"] for row in prior["parts"]
          })
          pointer = {
              "schema_version": 1,
              "archive_sha256": archive_hash,
              "archive_bytes": archive.stat().st_size,
              "parts": parts,
              "keep": keep,
          }
          Path(os.environ["CHECKPOINT_POINTER"]).write_text(
              json.dumps(pointer, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Stage canonical checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: corpus-checkpoint-${{ github.run_id }}
          path: |
            ${{ env.CHECKPOINT_POINTER }}
            ${{ env.CHECKPOINT_ROOT }}/checkpoint-*.part
            ${{ runner.temp }}/sweep-attach.json
            ${{ runner.temp }}/corpus-merge.json
            ${{ runner.temp }}/corpus-promo.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Publish canonical checkpoint
        id: checkpoint
        run: |
          release_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq .id)
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, (.digest // "")] | @tsv' \
            > "$RUNNER_TEMP/checkpoint-assets.tsv"
          missing=()
          while IFS=$'\t' read -r name digest; do
            api_digest=$(awk -F '\t' -v asset="$name" \
              '$2 == asset {print $3; exit}' "$RUNNER_TEMP/checkpoint-assets.tsv")
            if [ "$api_digest" = "sha256:$digest" ]; then
              continue
            fi
            if grep -q $'\t'"$name"$'\t' "$RUNNER_TEMP/checkpoint-assets.tsv"; then
              echo "Checkpoint asset collides with different content: $name" >&2
              exit 1
            fi
            missing+=("$CHECKPOINT_ROOT/$name")
          done < <(jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER")
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$CHECKPOINT_TAG" "${missing[@]}"
          fi
          archive_digest=$(jq -r '.archive_sha256' "$CHECKPOINT_POINTER")
          pointer="pointer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${archive_digest:0:16}.json"
          cp "$CHECKPOINT_POINTER" "$CHECKPOINT_ROOT/$pointer"
          gh release upload "$CHECKPOINT_TAG" "$CHECKPOINT_ROOT/$pointer"
          verify="$RUNNER_TEMP/checkpoint-verify"
          mkdir -p "$verify"
          gh release download "$CHECKPOINT_TAG" \
            --pattern "$pointer" \
            --dir "$verify"
          cmp "$CHECKPOINT_POINTER" "$verify/$pointer"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.id, .name, (.digest // "")] | @tsv' \
            > "$verify/assets.tsv"
          jq -r '.parts[] | [.name, .sha256] | @tsv' "$CHECKPOINT_POINTER" \
            | while IFS=$'\t' read -r name digest; do
                test "$(awk -F '\t' -v asset="$name" \
                  '$2 == asset {print $3; exit}' "$verify/assets.tsv")" = \
                  "sha256:$digest"
              done
          while IFS=$'\t' read -r id name _digest; do
            if [[ ! "$name" =~ ^checkpoint-[0-9a-f]{16}-[0-9]{4}-[0-9a-f]{16}\.part$ ]]; then
              continue
            fi
            if ! jq -e --arg name "$name" '.keep | index($name)' \
              "$CHECKPOINT_POINTER" >/dev/null; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          done < "$verify/assets.tsv"

      - name: Enforce atomic result
        if: always()
        env:
          PREP: ${{ steps.prep.outcome }}
          CHANGED: ${{ steps.prep.outputs.changed }}
          VERIFIED: ${{ steps.verify.outcome }}
          PACKAGED: ${{ steps.package.outcome }}
          CHECKPOINTED: ${{ steps.checkpoint.outcome }}
        run: |
          test "$PREP" = success
          if [ "$CHANGED" = true ]; then
            test "$VERIFIED" = success
          fi
          test "$PACKAGED" = success
          test "$CHECKPOINTED" = success
